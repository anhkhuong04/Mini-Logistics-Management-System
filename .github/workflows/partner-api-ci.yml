name: Partner API CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test-contract:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Mini-logistics-manegemant-system.slnx

      - name: Build and generate OpenAPI
        run: dotnet build Mini-logistics-manegemant-system.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test Mini-logistics-manegemant-system.slnx --no-build --configuration Release --logger "trx;LogFileName=partner-api-tests.trx"

      - name: Reject OpenAPI drift
        shell: pwsh
        run: |
          git diff --exit-code -- docs/partner-api.openapi.json
          if ($LASTEXITCODE -ne 0) {
            throw "Generated OpenAPI differs from the committed artifact. Review and commit the contract change."
          }

      - name: Reject unversioned breaking OpenAPI changes
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          $baseline = Join-Path $env:RUNNER_TEMP 'partner-api.baseline.json'
          git cat-file -e "${env:BASE_SHA}:docs/partner-api.openapi.json"
          if ($LASTEXITCODE -ne 0) {
            Write-Host 'The base branch has no Partner OpenAPI artifact; compatibility starts after this initial publication.'
            exit 0
          }
          git show "${env:BASE_SHA}:docs/partner-api.openapi.json" | Set-Content -LiteralPath $baseline -Encoding utf8
          ./scripts/Test-OpenApiCompatibility.ps1 -Baseline $baseline -Candidate docs/partner-api.openapi.json

      - name: Dependency vulnerability check
        shell: pwsh
        run: |
          $output = dotnet list Mini-logistics-manegemant-system.slnx package --vulnerable --include-transitive
          $output | Write-Host
          if ($LASTEXITCODE -ne 0 -or ($output -join "`n") -match "has the following vulnerable packages") {
            throw "A vulnerable NuGet dependency was detected."
          }

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: partner-api-test-results
          path: "**/TestResults/*.trx"
